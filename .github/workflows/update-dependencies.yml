name: Update Dockerfile dependencies

on:
  schedule:
    - cron: '43 9 * * *'
  workflow_dispatch:

concurrency:
  group: update-dockerfile-dependencies
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      UPDATE_BRANCH: automation/dockerfile-dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Resolve stable versions and update defaults
        id: versions
        run: python3 scripts/update_dependencies.py
      - name: Build and validate the proposed versions
        if: steps.versions.outputs.changed == 'true'
        run: python3 scripts/build.py --dockerfile-defaults
      - name: Create or update dependency PR
        if: steps.versions.outputs.changed == 'true'
        env:
          CADDY_VERSION: ${{ steps.versions.outputs.caddy }}
          CLOUDFLARE_VERSION: ${{ steps.versions.outputs.cloudflare }}
        run: |
          git diff --check
          git switch -c "$UPDATE_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile
          git commit -m "build(deps): update Caddy to $CADDY_VERSION and Cloudflare to $CLOUDFLARE_VERSION"
          gh auth setup-git
          remote=$(git ls-remote origin "refs/heads/$UPDATE_BRANCH")
          if [ -n "$remote" ]; then
            git fetch origin "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
          fi
          git push --force-with-lease origin "$UPDATE_BRANCH"
          body="$RUNNER_TEMP/dependency-pr.md"
          cat > "$body" <<EOF
          Update Dockerfile defaults to Caddy $CADDY_VERSION and Cloudflare $CLOUDFLARE_VERSION, including matching official builder/runtime images.

          The updater built these exact versions, checked Caddy and the sole custom module, and validated the wildcard configuration with networking disabled. No image was published by this workflow.

          This branch is maintained automatically. GitHub may require approval to run the separate PR checks for PRs created with GITHUB_TOKEN.
          EOF
          pr=$(gh pr list --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')
          title="build(deps): update Caddy to $CADDY_VERSION and Cloudflare to $CLOUDFLARE_VERSION"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$body"
          else
            gh pr create --base main --head "$UPDATE_BRANCH" --title "$title" --body-file "$body"
          fi
